server:
  port: 80
  # 响应压缩：JSON 列表与前端静态资源体积压到 1/3 左右；text/event-stream 不在 mime-types 里，SSE 不受影响
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain,text/xml,application/xml,image/svg+xml
    min-response-size: 2048
  tomcat:
    # 如果启用了全局虚拟线程，这里的配置会失效
    threads:
      min-spare: 50
      max: 200
    max-connections: 10000
spring:
  application:
    name: gfs
  profiles:
    active: dev
  mvc:
    async:
      # 预留充足超时，避免长耗时/大文件异步流式交付期间提前关闭对象存储文件流
      request-timeout: 360s
    formcontent:
      filter:
        # 关闭 FormContentFilter：本项目 API 均为 JSON；且它会在 PUT+form 编码时预读掉请求体，
        # 导致 WebDAV PUT（curl 默认 Content-Type 为 x-www-form-urlencoded 时）读不到内容
        enabled: false
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      # 兜底上限：接口侧分片大小上限 1GB，分片始终流式落盘；这里只防无界请求体（-1 会让任意大请求直接进内存）
      max-file-size: 1024MB
      max-request-size: 1100MB
  web:
    resources:
      # 添加静态资源位置
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/.well-known/
  # 开启循环依赖
  main:
    allow-circular-references: true
    keep-alive: true
  # 全局启用虚拟线程
  threads:
    virtual:
      enabled: true
  # 国际化支持
  messages:
    basename: i18n/messages
    encoding: UTF-8
  # 模版引擎配置
  #  thymeleaf:
  #    mode: LEGACYHTML5
  #    prefix: classpath:/templates/
  #    encoding: UTF-8

--- # mybatis-flex配置
mybatis-flex:
  # 搜索指定包别名
  type-aliases-package: com.guanghe.fs.*.domain
  # 不支持多包, 如有需要可在注解配置 或 提升扫包等级：com.**.**.mapper
  mapper-package: com.guanghe.fs.*.mapper
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    ## 以下为mybatis原生配置 https://mybatis.org/mybatis-3/zh/configuration.html
    # 自动驼峰命名规则（camel case）映射
    map_underscore_to_camel_case: true
    # MyBatis 自动映射策略
    # NONE：不启用 PARTIAL：只对非嵌套 resultMap 自动映射 FULL：对所有 resultMap 自动映射
    auto_mapping_behavior: FULL
    # MyBatis 自动映射时未知列或未知属性处理策
    # NONE：不做处理 WARNING：打印相关警告 FAILING：抛出异常和详细信息
    auto_mapping_unknown_column_behavior: NONE
    # 更详细的日志输出 会有性能损耗 org.apache.ibatis.logging.stdout.StdOutImpl
    # 关闭日志记录 org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 默认日志输出 org.apache.ibatis.logging.slf4j.Slf4jImpl
    #log_impl: org.apache.ibatis.logging.stdout.StdOutImpl
    logImpl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    cacheEnabled: true
  global-config:
    # 是否控制台打印 MyBatis-Flex 的 LOGO 及版本号
    print-banner: false
    # 全局的 ID 生成策略配置:雪花算法
    key-config:
      key-type: Generator
      value: snowFlakeId
    # 逻辑未删除值
    normal-value-of-logic-delete: 0
    # 逻辑已删除值(框架表均使用此值 禁止随意修改)
    deleted-value-of-logic-delete: 1
    # 默认的逻辑删除字段
    logic-delete-column: del_flag

--- # 认证授权相关配置
security:
  # 拦截路由前缀
  path-pattern: /apis/**
  # 是否信任反向代理写入的来源头（X-Forwarded-For 等）。
  # false（默认，直连部署）：客户端 IP 一律取 TCP 层对端地址——这些头是请求方自己填的，
  #   采信后攻击者每请求换一个假 IP 就能拿到新的计数桶，登录防爆破、注册限流、IP 黑白名单、
  #   文件收集访问码限制会同时失效。
  # true：仅当应用确实坐在 Nginx 等可信代理后面、且代理覆写（而非追加）了转发头时开启。
  trust-proxy: false
  # 防暴力：登录按「账号+IP」计失败次数；注册除失败锁外，成功注册也按 IP 计配额
  brute-force:
    # 连续失败多少次后锁定
    max-attempts: 3
    # 锁定时长（分钟）
    lock-minutes: 30
    # 同一 IP 每小时允许的成功注册次数（0 表示不限制）
    register-max-per-hour: 10
    # 同一 IP 每 24 小时允许的成功注册次数（0 表示不限制）
    register-max-per-day: 50
  #排除不需要登录认证的接口
  excludes:
    - /apis/auth/login
    - /apis/auth/config
    - /apis/transfer/sse
    - /apis/user/register
    - /apis/invitation/verify/**
    - /apis/share/**/items
    - /apis/share/verify/code
    - /apis/share/**/info
    - /apis/share/**/download/**
    - /apis/share/**/raw/**
    - /apis/file-collections/public/**
    - /dav/**
    - /oss/**
    - /webdav-test/**

--- #Sa-Token 配置
sa-token:
  # token 名称（作为请求头与查询参数的凭证名）
  token-name: Authorization
  # token 前缀
  token-prefix: Bearer
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 86400
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: 3600
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # 从请求参数读取 token：下载、SSE 等无法自定义请求头的场景靠此通道传 Authorization=Bearer <token>
  is-read-body: true
  # 关闭 cookie 读写：token-prefix 为 Bearer 时 cookie 里的裸 token 过不了前缀校验，
  # 开着只会多余地下发一个永不被接受的死凭证（此开关同时控制登录时是否写 cookie）
  is-read-cookie: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-128
  # 是否输出操作日志：每个请求都会打一行 token 操作明细，生产环境关闭
  is-log: false

--- #接口文档 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# OSS（S3 兼容网关）配置
oss:
  # Secret Key 存储加密主密钥（32 字节）。故意不给默认值：仓库里的常量一旦当默认用，
  # 就等于公开了加密密钥。留空或仍是旧默认值时会生成本次运行随机密钥并告警，
  # 重启后已签发的 OSS Secret Key 需重新签发；正式部署请用 OSS_AES_KEY 环境变量固化。
  aes-key: "${OSS_AES_KEY:}"

fs:
  cors:
    allowed-origins: ${FS_CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:8000,http://127.0.0.1:8000}
